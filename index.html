<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#11111B">
<meta name="description" content="DailyDrop is a private space for your friend group.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DailyDrop">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>DailyDrop</title>
<style>
:root{--bg:#11111B;--s1:#181825;--s2:#1E1E2E;--line:#313244;--acc:#A78BFA;--acc2:#CBA6F7;--tx:#CDD6F4;--mu:#A6ADC8;--bad:#F38BA8;--ok:#A6E3A1;color-scheme:dark;
 --top:env(safe-area-inset-top,0px);--bot:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font:400 15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
button,input,textarea,select{font:inherit;color:inherit}
#root{min-height:100%}
.screen{min-height:100vh;padding:calc(var(--top) + 16px) 18px calc(96px + var(--bot));max-width:560px;margin:0 auto;animation:in .35s cubic-bezier(.2,.7,.2,1)}
.screen.bare{padding-bottom:calc(32px + var(--bot))}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
h1{font-size:1.6rem;font-weight:800;letter-spacing:-.02em;line-height:1.15}h2{font-size:1.1rem;font-weight:700;margin:22px 0 10px}
.mu{color:var(--mu)}.sm{font-size:.82rem}.c{text-align:center}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}.grow{flex:1;min-width:0}
.card{background:var(--s2);border:1px solid rgba(205,214,244,.06);border-radius:20px;padding:16px;margin-bottom:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 18px;border:0;border-radius:14px;background:linear-gradient(120deg,var(--acc2),var(--acc));color:#11111B;font-weight:700;cursor:pointer;transition:transform .15s,opacity .15s}
.btn:active{transform:scale(.98)}.btn:disabled{opacity:.55}
.btn.ghost{background:var(--s2);color:var(--tx);border:1px solid var(--line)}.btn.bad{background:rgba(243,139,168,.15);color:var(--bad);border:1px solid rgba(243,139,168,.4)}
.btn.sm{width:auto;padding:8px 14px;border-radius:10px;font-size:.85rem}
label{display:block;font-size:.82rem;color:var(--mu);margin:0 0 12px}
input,textarea,select{display:block;width:100%;margin-top:6px;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--s1);outline:0;transition:border-color .2s}
input:focus,textarea:focus,select:focus{border-color:var(--acc)}textarea{resize:none;min-height:84px}
.err{color:var(--bad);font-size:.88rem;margin:0 0 12px;min-height:0}
.pw{position:relative}.pw button{position:absolute;right:6px;bottom:6px;background:none;border:0;color:var(--acc2);padding:8px;font-size:.8rem}
.av{display:inline-grid;place-items:center;flex:none;border-radius:50%;overflow:hidden;background:linear-gradient(135deg,var(--acc2),var(--acc));color:#11111B;font-weight:800}.av img{width:100%;height:100%;object-fit:cover}
.skel{background:linear-gradient(100deg,var(--s2) 30%,#2a2a3d 50%,var(--s2) 70%);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:14px}
@keyframes sh{to{background-position:-200% 0}}
.photo{width:100%;aspect-ratio:4/5;border-radius:16px;object-fit:cover;display:block;background:var(--s1)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{border:1px solid var(--line);background:var(--s1);border-radius:99px;padding:5px 11px;font-size:.85rem;cursor:pointer;transition:transform .15s}
.chip.on{border-color:var(--acc);background:rgba(167,139,250,.18)}.chip:active{transform:scale(.92)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.grid>*{aspect-ratio:1;border-radius:10px;object-fit:cover;width:100%;background:var(--s2);border:0;padding:0;overflow:hidden}.grid img{width:100%;height:100%;object-fit:cover;display:block}
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:rgba(24,24,37,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid rgba(205,214,244,.07);padding:6px 6px calc(6px + var(--bot));z-index:20}
.tabbar>div{display:flex;width:100%;max-width:560px}
.tab{flex:1;display:grid;justify-items:center;gap:2px;padding:6px 0;border:0;background:none;color:var(--mu);font-size:.68rem;font-weight:600;cursor:pointer}.tab.on{color:var(--acc2)}
svg.i{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.fab{position:fixed;right:18px;bottom:calc(84px + var(--bot));z-index:15;width:56px;height:56px;border-radius:18px;border:0;background:linear-gradient(120deg,var(--acc2),var(--acc));color:#11111B;box-shadow:0 12px 30px -8px rgba(167,139,250,.7);display:grid;place-items:center;cursor:pointer}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{width:100%;max-width:560px;max-height:82vh;overflow:auto;background:var(--s1);border-radius:24px 24px 0 0;padding:18px 18px calc(18px + var(--bot));animation:up .3s cubic-bezier(.2,.7,.2,1)}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(40px);opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(100px + var(--bot));transform:translate(-50%,16px);background:var(--s2);border:1px solid var(--line);padding:11px 18px;border-radius:14px;z-index:60;opacity:0;pointer-events:none;transition:.25s;max-width:88vw;text-align:center;font-weight:500}.toast.on{opacity:1;transform:translate(-50%,0)}
.splash{min-height:100vh;display:grid;place-content:center;justify-items:center;gap:14px;background:radial-gradient(60% 40% at 50% 40%,rgba(167,139,250,.25),transparent 70%),var(--bg)}
.splash .lg{animation:pop 1s cubic-bezier(.2,.9,.3,1.3) both}.splash h1{animation:in .8s .3s both}.splash p{animation:in .8s .5s both}
@keyframes pop{from{opacity:0;transform:scale(.4) translateY(14px)}}
.logo{display:grid;place-items:center;border-radius:28%;background:linear-gradient(135deg,var(--acc2),var(--acc))}
.gt{background:linear-gradient(100deg,var(--acc2),var(--acc) 60%,#89B4FA);-webkit-background-clip:text;background-clip:text;color:transparent}
.tog{width:46px;height:28px;border-radius:99px;background:var(--line);border:0;position:relative;transition:.2s;flex:none}.tog:after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}.tog.on{background:var(--acc)}.tog.on:after{left:21px}
.back{background:none;border:0;color:var(--acc2);font-weight:600;padding:4px 0;margin-bottom:8px;cursor:pointer}
.empty{text-align:center;padding:40px 10px;color:var(--mu)}.empty b{display:block;color:var(--tx);font-size:1.05rem;margin-bottom:4px}
.bar{height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:var(--acc);transition:width .2s}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<div id="ios-install-tip" hidden style="position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:100;background:#1E1E2E;border:1px solid rgba(203,166,247,.45);border-radius:16px;padding:14px 16px;color:#CDD6F4;font:14px/1.45 system-ui,sans-serif;box-shadow:0 12px 36px rgba(0,0,0,.4)">
  <button id="ios-install-close" aria-label="Dismiss" style="float:right;background:transparent;border:0;color:#A6ADC8;font-size:20px;padding:0 0 8px 12px">×</button>
  <strong style="color:#CBA6F7">Install DailyDrop</strong>
  <div style="margin-top:4px">In Safari, tap <strong>Share</strong>, then choose <strong>Add to Home Screen</strong>.</div>
</div>
<script>
(() => {
  const ua = navigator.userAgent;
  const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  const isSafari = /Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS/.test(ua);
  const tip = document.getElementById('ios-install-tip');
  if (isIOS && isSafari && !isStandalone && !sessionStorage.getItem('dd-ios-tip-dismissed')) tip.hidden = false;
  document.getElementById('ios-install-close').addEventListener('click', () => {
    tip.hidden = true;
    sessionStorage.setItem('dd-ios-tip-dismissed', '1');
  });
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(err => console.warn('DailyDrop offline support unavailable:', err)));
  }
})();
</script>
<script src="vendor/react.js"></script>
<script src="vendor/react-dom.js"></script>
<script src="vendor/htm.js"></script>
<script src="vendor/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
